<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Georgia,'Times New Roman',serif;color:#111827;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td align="center" style="padding:28px 24px 8px;">
          <a href="{{ frontend_url }}" style="text-decoration:none;">
            <img src="{{ logo_url }}" width="72" height="72" alt="{{ site_name }}" style="display:block;border:0;margin:0 auto 8px;">
          </a>
          <div style="font-size:20px;letter-spacing:.5px;">{{ site_name }}</div>
        </td></tr>
        <tr><td style="padding:16px 32px 32px;font-size:16px;line-height:1.6;">
          {% block body %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 32px;background:#fafafa;border-top:1px solid #e5e7eb;font-size:12px;color:#6b7280;text-align:center;">
          &copy; {{ year }} {{ site_name }} &middot; <a href="{{ frontend_url }}" style="color:#6b7280;">{{ frontend_url }}</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
