{% extends "base.html" %}
{% from "macros.html" import quote %}
{% block body %}
<h2 style="margin:0 0 12px;font-weight:normal;">New feedback</h2>
<p><strong>{{ name }}</strong> &lt;{{ email }}&gt;{% if feedback_subject %}<br>Subject: {{ feedback_subject }}{% endif %}</p>
{{ quote(message) }}
<p style="color:#6b7280;font-size:14px;">Reply to this email to answer them directly.</p>
{% endblock %}
