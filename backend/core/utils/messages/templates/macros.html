{% macro button(url, label) %}
<p style="text-align:center;margin:28px 0;">
  <a href="{{ url }}" style="background:#111827;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:6px;font-family:Arial,sans-serif;font-size:15px;display:inline-block;">{{ label }}</a>
</p>
{% endmacro %}

{% macro quote(text) %}
<blockquote style="margin:16px 0;padding:12px 16px;background:#f9fafb;border-left:3px solid #111827;white-space:pre-wrap;">{{ text }}</blockquote>
{% endmacro %}
