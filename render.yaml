services:
  - type: web
    name: el-deras-writes
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # set in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: FRONTEND_URL
        value: "https://el-deras-writes.pages.dev"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://el-deras-writes.pages.dev,http://localhost:5173"
